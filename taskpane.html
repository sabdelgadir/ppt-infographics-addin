<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infographics Library</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f4f5f8;
      --surface-hover: #eceef3;
      --border: #dfe2e8;
      --text: #1f2a44;
      --muted: #5b6478;
      --accent: #2e8b8b;
      --ok: #2f7d4f;
      --err: #b3261e;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1f22; --surface: #2a2c30; --surface-hover: #33363b; --border: #3a3d43;
        --text: #eceef2; --muted: #a6acb8; --accent: #5cc2c2; --ok: #7fd3a0; --err: #ff8a80;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.4 "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    header { position: sticky; top: 0; background: var(--bg); padding: 16px 16px 10px; z-index: 2;
      border-bottom: 1px solid var(--border); }
    h1 { font-size: 17px; margin: 0 0 2px; font-weight: 650; }
    .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
    input[type=search] { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--text); font: inherit; outline: none; }
    input[type=search]:focus { border-color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip { border: 1px solid var(--border); background: transparent; color: var(--muted); font: inherit;
      font-size: 12px; padding: 4px 10px; border-radius: 999px; cursor: pointer; }
    .chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
    main { padding: 14px 16px 80px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .card { display: block; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--surface);
      border-radius: var(--radius); padding: 8px; cursor: pointer; color: inherit; font: inherit;
      transition: background .15s, border-color .15s, transform .15s; }
    .card:hover { background: var(--surface-hover); border-color: var(--accent); }
    .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .card:active { transform: scale(.985); }
    .card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px;
      background: #fff; border: 1px solid var(--border); }
    .card .name { font-weight: 600; margin: 8px 2px 0; }
    .card .cat { color: var(--muted); font-size: 12px; margin: 0 2px 2px; }
    .card[aria-busy=true] { opacity: .6; pointer-events: none; }
    .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 24px 0; }
    #toast { position: fixed; left: 12px; right: 12px; bottom: 12px; padding: 10px 12px; border-radius: 8px;
      background: var(--text); color: var(--bg); font-size: 13px; opacity: 0; transform: translateY(8px);
      transition: opacity .2s, transform .2s; pointer-events: none; }
    #toast.show { opacity: 1; transform: none; }
    #toast.err { background: var(--err); color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>Infographics</h1>
    <p class="sub">Click a design to add it as a new, fully editable slide.</p>
    <input id="search" type="search" placeholder="Search designs" aria-label="Search designs">
    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
  </header>
  <main id="gallery" aria-live="polite"><p class="empty">Loading designs…</p></main>
  <div id="toast" role="status"></div>

  <script>
    var designs = [];
    var activeCat = "All";
    var gallery = document.getElementById("gallery");
    var chips = document.getElementById("chips");
    var search = document.getElementById("search");
    var toastEl = document.getElementById("toast");
    var toastTimer;

    function toast(msg, isErr) {
      toastEl.textContent = msg;
      toastEl.className = "show" + (isErr ? " err" : "");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.className = ""; }, isErr ? 6000 : 2800);
    }

    function render() {
      var q = search.value.trim().toLowerCase();
      var list = designs.filter(function (d) {
        var inCat = activeCat === "All" || d.category === activeCat;
        var inQ = !q || d.name.toLowerCase().indexOf(q) > -1 || (d.category || "").toLowerCase().indexOf(q) > -1;
        return inCat && inQ;
      });
      gallery.innerHTML = "";
      if (!list.length) {
        gallery.innerHTML = '<p class="empty">No designs match.</p>';
        return;
      }
      list.forEach(function (d) {
        var b = document.createElement("button");
        b.className = "card";
        b.type = "button";
        b.title = "Insert " + d.name;
        var img = document.createElement("img");
        img.src = d.thumbnail; img.alt = ""; img.loading = "lazy";
        var n = document.createElement("p"); n.className = "name"; n.textContent = d.name;
        var c = document.createElement("p"); c.className = "cat"; c.textContent = d.category || "";
        b.appendChild(img); b.appendChild(n); b.appendChild(c);
        b.addEventListener("click", function () { insertDesign(d, b); });
        gallery.appendChild(b);
      });
    }

    function renderChips() {
      var cats = ["All"];
      designs.forEach(function (d) { if (d.category && cats.indexOf(d.category) < 0) cats.push(d.category); });
      chips.innerHTML = "";
      cats.forEach(function (cat) {
        var c = document.createElement("button");
        c.className = "chip"; c.type = "button"; c.textContent = cat;
        c.setAttribute("aria-pressed", String(cat === activeCat));
        c.addEventListener("click", function () { activeCat = cat; renderChips(); render(); });
        chips.appendChild(c);
      });
    }

    function toBase64(buffer) {
      var bytes = new Uint8Array(buffer), chunk = 0x8000, out = "";
      for (var i = 0; i < bytes.length; i += chunk) {
        out += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(out);
    }

    async function insertDesign(d, card) {
      card.setAttribute("aria-busy", "true");
      try {
        var res = await fetch(d.file, { cache: "no-cache" });
        if (!res.ok) throw new Error("Could not download " + d.file + " (" + res.status + ")");
        var b64 = toBase64(await res.arrayBuffer());

        await PowerPoint.run(async function (context) {
          var options = { formatting: PowerPoint.InsertSlideFormatting.keepSourceFormatting };
          // Put the new slide right after the one you're on, when this PowerPoint supports it.
          if (Office.context.requirements.isSetSupported("PowerPointApi", "1.5")) {
            var selected = context.presentation.getSelectedSlides();
            selected.load("items/id");
            await context.sync();
            if (selected.items.length) options.targetSlideId = selected.items[selected.items.length - 1].id;
          }
          context.presentation.insertSlidesFromBase64(b64, options);
          await context.sync();
        });
        toast(d.name + " added as a new slide.");
      } catch (e) {
        console.error(e);
        toast("Couldn't insert: " + (e && e.message ? e.message : e), true);
      } finally {
        card.removeAttribute("aria-busy");
      }
    }

    async function load() {
      try {
        var res = await fetch("designs.json", { cache: "no-cache" });
        designs = await res.json();
        renderChips();
        render();
      } catch (e) {
        gallery.innerHTML = '<p class="empty">Couldn\'t load the design list.</p>';
      }
    }

    search.addEventListener("input", render);
    Office.onReady(function (info) {
      load();
      if (info.host !== Office.HostType.PowerPoint) {
        toast("Open this from PowerPoint to insert designs.", true);
      } else if (!Office.context.requirements.isSetSupported("PowerPointApi", "1.2")) {
        toast("Please update PowerPoint — this add-in needs a newer version.", true);
      }
    });
  </script>
</body>
</html>
